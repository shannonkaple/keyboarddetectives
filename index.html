<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ms. Kaple's Keyboard Detective Agency</title>
<style>
@font-face{font-family:Homebody;src:url('./KAHomebodyClub.ttf') format('truetype');font-display:swap}
@font-face{font-family:VAG;src:url('./VAGRoundedBlack.ttf') format('truetype');font-display:swap}

:root{
  --ink:#17202a;
  --paper:#fffdf7;
  --yellow:#ffd84a;
  --blue:#65c7ff;
  --green:#78d978;
  --pink:#ff86b7;
  --purple:#b78cff;
  --orange:#ffad5a;
  --red:#ff7777;
  --teal:#62d7ce;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:VAG,Arial,Helvetica,sans-serif;background:#eaf4fb;color:var(--ink);user-select:none}
body{overflow-x:hidden}
button{font:inherit}
#app{min-height:100vh;background:
  linear-gradient(rgba(255,255,255,.82),rgba(255,255,255,.82)),
  repeating-linear-gradient(45deg,#dbe8f0 0 18px,#edf5fa 18px 36px);
}
header{
  background:#152231;color:white;padding:12px 18px;border-bottom:6px solid #0b1118;
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap
}
.brand{display:flex;align-items:center;gap:12px}
.brand .emoji{font-size:42px}
.brand h1{margin:0;font-family:Homebody,VAG,sans-serif;text-transform:uppercase;font-size:clamp(30px,3.7vw,54px);letter-spacing:.5px}
.brand small{display:block;font-family:VAG,sans-serif;font-size:14px;opacity:.88;letter-spacing:1px}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav button{
  font-family:VAG,sans-serif;
  border:3px solid white;border-radius:12px;background:#24384d;color:white;
  padding:8px 12px;cursor:pointer;font-weight:800
}
main{padding:14px}
.view{display:none}.view.active{display:block}

.case-note{
  max-width:1380px;margin:0 auto 14px;background:#fff8c9;border:4px dashed #3f3a22;
  border-radius:18px;padding:10px 16px;text-align:center;font-weight:800;
  font-size:clamp(17px,1.8vw,24px)
}
.case-grid{
  max-width:1380px;margin:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px
}
.case-card{
  border:5px solid #17202a;border-radius:20px;background:white;overflow:hidden;cursor:pointer;
  box-shadow:0 5px 0 #17202a;min-height:260px;display:grid;grid-template-rows:auto 1fr auto
}
.case-card:hover{transform:translateY(-2px)}
.case-card:active{transform:translateY(3px);box-shadow:0 2px 0 #17202a}
.case-head{
  padding:9px 10px;display:flex;align-items:center;gap:9px;border-bottom:4px solid #17202a;
  font-family:Homebody,VAG,sans-serif;text-transform:uppercase;font-size:clamp(20px,1.85vw,29px)
}
.case-num{
  width:38px;height:38px;border:3px solid #17202a;border-radius:50%;background:white;
  display:grid;place-items:center;flex:0 0 38px
}
.case-art{
  display:grid;place-items:center;min-height:150px;background:linear-gradient(#f7fbff,#eef7fb);
  font-size:74px;position:relative;overflow:hidden
}
.case-art .mini{font-size:30px;position:absolute}
.case-desc{padding:9px 10px;text-align:center;font-weight:800;font-size:15px;background:white}

.c1 .case-head{background:var(--yellow)}
.c2 .case-head{background:var(--blue)}
.c3 .case-head{background:var(--green)}
.c4 .case-head{background:var(--pink)}
.c5 .case-head{background:var(--purple)}
.c6 .case-head{background:var(--orange)}
.c7 .case-head{background:var(--teal)}
.c8 .case-head{background:var(--red)}

#gameWrap{max-width:1400px;margin:auto}
#gameTop{
  display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin-bottom:9px
}
#gameTitle{font-family:Homebody,VAG,sans-serif;text-transform:uppercase;font-size:clamp(29px,3.2vw,46px)}
.badges{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.badge{border:4px solid #17202a;border-radius:999px;background:white;padding:7px 12px;font-weight:900}

#briefing{
  border:4px solid #17202a;border-radius:18px;background:#fff8c9;padding:10px 14px;margin-bottom:10px;
  text-align:center;font-size:clamp(19px,2vw,29px);font-weight:900;min-height:66px;
  display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap
}
#briefing .clueEmoji{font-size:44px}
#stage{
  height:620px;border:5px solid #17202a;border-radius:22px;background:#f9fcff;position:relative;overflow:hidden;
  box-shadow:inset 0 0 0 8px rgba(255,255,255,.55)
}
.detective-bg{
  position:absolute;inset:0;background:
    linear-gradient(rgba(235,246,255,.92),rgba(255,255,255,.94)),
    repeating-linear-gradient(0deg,transparent 0 44px,rgba(62,118,160,.08) 44px 46px)
}
.tape{
  position:absolute;left:-60px;right:-60px;height:48px;background:#ffd92f;border-top:4px solid #17202a;border-bottom:4px solid #17202a;
  font-weight:900;display:flex;align-items:center;justify-content:center;letter-spacing:3px;transform:rotate(-3deg);opacity:.9
}
.tape.top{top:34px}.tape.bottom{bottom:36px;transform:rotate(2deg)}
.panel{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(980px,84%);min-height:360px;border:5px solid #17202a;border-radius:24px;background:white;
  padding:24px;display:grid;place-items:center;text-align:center;box-shadow:0 8px 0 rgba(23,32,42,.25)
}
.bigPrompt{font-size:clamp(70px,11vw,160px);font-weight:900;line-height:1}
.mediumPrompt{font-size:clamp(42px,6vw,86px);font-weight:900;line-height:1.1}
.smallPrompt{font-size:clamp(24px,3vw,42px);font-weight:900}
.keyRow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.key{
  min-width:100px;min-height:88px;border:5px solid #17202a;border-radius:17px;background:#fff;
  display:grid;place-items:center;font-size:48px;font-weight:900;box-shadow:0 6px 0 #c7d3dc
}
.hint{font-size:18px;font-weight:800;opacity:.7}
.sequence{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.seqBox{
  width:88px;height:88px;border:5px solid #17202a;border-radius:17px;background:#fff;
  display:grid;place-items:center;font-size:46px;font-weight:900
}
.seqBox.blank{background:#fff8c9;color:#777;border-style:dashed}
.countArea{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:58px;max-width:820px}
.choiceRow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.choice{
  border:5px solid #17202a;border-radius:18px;background:white;padding:12px 18px;min-width:120px;
  font-size:40px;font-weight:900;cursor:pointer;box-shadow:0 5px 0 #17202a
}
.choice:active{transform:translateY(3px);box-shadow:0 2px 0 #17202a}
.progressBar{
  position:absolute;left:28px;right:28px;bottom:22px;height:26px;border:4px solid #17202a;border-radius:999px;background:white;overflow:hidden
}
.progressFill{height:100%;background:#69d269;width:0%;transition:.25s}
#toast{
  position:absolute;left:50%;top:18px;transform:translateX(-50%);z-index:50;
  border:4px solid #17202a;border-radius:14px;background:white;padding:8px 14px;font-size:22px;font-weight:900;
  opacity:0;transition:.15s
}
#toast.show{opacity:1}
.solve{
  position:absolute;inset:0;z-index:80;background:rgba(255,255,255,.96);display:grid;place-items:center;text-align:center
}
.solveBox{
  border:6px solid #17202a;border-radius:26px;background:white;padding:28px 40px;box-shadow:0 8px 0 #17202a
}
.solveBox .emoji{font-size:80px}.solveBox h2{font-family:Homebody,VAG,sans-serif;text-transform:uppercase;font-size:clamp(44px,7vw,90px);margin:4px 0}.solveBox p{font-size:24px;font-weight:800}
.solveBox button{border:4px solid #17202a;border-radius:14px;padding:10px 18px;background:#ffd84a;font-weight:900;cursor:pointer;margin:4px}

#keyboardHelp{
  max-width:1380px;margin:14px auto 0;border:4px solid #17202a;border-radius:16px;background:white;padding:9px 12px;
  text-align:center;font-weight:800;font-size:15px
}

@media(max-width:1000px){
  .case-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  #stage{height:680px}
}
@media(max-width:560px){
  .case-grid{grid-template-columns:1fr}
}

/* Auto-fit on school computers: JS sets browser zoom based on viewport. */

.brandAgent{width:72px;height:72px;object-fit:contain;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.case-art img{max-width:76%;max-height:142px;object-fit:contain;filter:drop-shadow(0 4px 2px rgba(0,0,0,.16))}
.caseArtPair{display:flex;align-items:center;justify-content:center;gap:16px;width:100%;height:100%}
.cardSpeaker,.speakBtn{
  width:44px;height:44px;min-width:44px;border:3px solid #17202a;border-radius:50%;
  background:white;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 0 #17202a;color:#17202a
}
.cardSpeaker{margin-left:auto}
.speakerSvg{width:24px;height:24px;fill:currentColor}
.cardSpeaker:active,.speakBtn:active{transform:translateY(1px);box-shadow:none}
.readable{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.promptSpeaker{margin-top:16px}
.reward{
  position:absolute;inset:0;z-index:75;background:rgba(244,249,253,.96);display:grid;place-items:center;text-align:center
}
.rewardBox{
  border:6px solid #17202a;border-radius:26px;background:white;padding:26px 36px;box-shadow:0 8px 0 #17202a;
  min-width:min(600px,84%)
}
.rewardBox h2{font-family:Homebody,VAG,sans-serif;text-transform:uppercase;font-size:clamp(42px,6vw,78px);margin:2px 0 8px}
.rewardBox img{width:170px;height:170px;object-fit:contain}
.rewardBox p{font-size:24px;margin:8px 0 14px}
.rewardBox button{border:4px solid #17202a;border-radius:14px;padding:10px 18px;background:#ffd84a;font-weight:900;cursor:pointer}
.agentCorner{position:absolute;right:16px;bottom:55px;width:155px;height:180px;object-fit:contain;opacity:.95;pointer-events:none}


.rankHome{
  max-width:1380px;margin:0 auto 14px;border:5px solid #17202a;border-radius:20px;background:white;
  padding:10px 15px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:15px;
  box-shadow:0 5px 0 #17202a
}
.rankHome img{width:88px;height:88px;object-fit:contain}
.rankHome .rankTitle{font-family:Homebody,VAG,sans-serif;text-transform:uppercase;font-size:clamp(24px,2.4vw,37px)}
.rankHome .rankSub{font-size:17px;margin-top:2px}
.rankProgress{height:20px;border:3px solid #17202a;border-radius:999px;background:#eef3f6;overflow:hidden;margin-top:7px}
.rankProgress>div{height:100%;background:#ffd84a;transition:.3s}
.rankPoints{font-size:20px;text-align:center;white-space:nowrap}
.rankChip{
  border:4px solid #17202a;border-radius:999px;background:#fff8c9;padding:4px 10px;
  display:flex;align-items:center;gap:7px;font-size:15px;font-weight:900
}
.rankChip img{width:38px;height:38px;object-fit:contain}
.rankUp{
  position:absolute;inset:0;z-index:95;background:rgba(239,247,252,.97);display:grid;place-items:center;text-align:center
}
.rankUpBox{
  min-width:min(650px,86%);border:7px solid #17202a;border-radius:28px;background:white;
  padding:26px 40px;box-shadow:0 9px 0 #17202a
}
.rankUpBox img{width:190px;height:190px;object-fit:contain}
.rankUpBox h2{
  font-family:Homebody,VAG,sans-serif;text-transform:uppercase;font-size:clamp(50px,7vw,92px);
  margin:0;color:#b88000
}
.rankUpBox h3{
  font-family:Homebody,VAG,sans-serif;text-transform:uppercase;font-size:clamp(29px,4vw,52px);
  margin:5px 0 8px
}
.rankUpBox p{font-size:22px;margin:7px 0 15px}
.rankUpBox button{
  border:4px solid #17202a;border-radius:14px;padding:10px 20px;background:#ffd84a;
  font-family:VAG,sans-serif;font-size:20px;cursor:pointer
}
@media(max-width:700px){
  .rankHome{grid-template-columns:auto 1fr}
  .rankPoints{grid-column:1/-1}
}


.bonusHeader{
  max-width:1380px;margin:24px auto 10px;font-family:Homebody,VAG,sans-serif;
  text-transform:uppercase;font-size:clamp(30px,3vw,46px);text-align:center
}
.bonusGrid{
  max-width:1380px;margin:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px
}
.bonusCard{
  border:6px solid #17202a;border-radius:22px;background:white;overflow:hidden;cursor:pointer;
  box-shadow:0 6px 0 #17202a;padding:0;display:grid;grid-template-rows:auto 1fr auto
}
.bonusCard:active{transform:translateY(3px);box-shadow:0 3px 0 #17202a}
.bonusTitle{
  font-family:Homebody,VAG,sans-serif;text-transform:uppercase;font-size:clamp(24px,2.3vw,38px);
  padding:10px;border-bottom:4px solid #17202a
}
.chaseBonus .bonusTitle{background:#7ee0ff}.vaultBonus .bonusTitle{background:#ffd84a}
.bonusVisual{
  min-height:190px;display:flex;align-items:center;justify-content:center;gap:18px;padding:12px;
  background:linear-gradient(#f8fcff,#e9f6fb);position:relative
}
.bonusVisual img{width:150px;height:160px;object-fit:contain}
.chaseArrow{font-size:70px;animation:pulseArrow .8s ease-in-out infinite alternate}
.vaultDigits{
  border:5px solid #17202a;border-radius:18px;padding:12px 18px;background:#17202a;color:white;
  font-size:42px;letter-spacing:9px;font-family:VAG,sans-serif
}
.bonusDesc{padding:10px 14px;font-size:18px;text-align:center}
@keyframes pulseArrow{from{transform:translateX(-7px)}to{transform:translateX(7px)}}

.chaseScene{
  position:absolute;inset:0;overflow:hidden;background:
  linear-gradient(#a8e4ff 0 58%,#6f8794 58% 62%,#263744 62% 100%)
}
.cityBuilding{
  position:absolute;bottom:0;background:#1d2a36;border:4px solid #101820
}
.cityBuilding:before{
  content:"";position:absolute;inset:12px;
  background:repeating-linear-gradient(90deg,#ffd969 0 18px,transparent 18px 42px),
             repeating-linear-gradient(0deg,#ffd969 0 16px,transparent 16px 40px);
  opacity:.55
}
.chaseTrack{
  position:absolute;left:7%;right:7%;bottom:100px;height:260px;
  border-bottom:6px dashed rgba(255,255,255,.55)
}
.chaseAgent,.chaseSuspect{
  position:absolute;bottom:12px;width:160px;height:210px;object-fit:contain;
  transition:left .45s ease;filter:drop-shadow(0 5px 3px rgba(0,0,0,.3))
}
.chaseAgent{left:0}.chaseSuspect{right:0;transform:scaleX(-1)}
.chasePrompt{
  position:absolute;left:50%;top:35px;transform:translateX(-50%);
  min-width:360px;border:5px solid #17202a;border-radius:22px;background:white;
  text-align:center;padding:12px 24px;box-shadow:0 6px 0 #17202a
}
.chasePrompt .targetKey{font-size:90px;font-family:Homebody,VAG,sans-serif}
.chaseMeter{
  position:absolute;left:12%;right:12%;bottom:36px;height:34px;border:5px solid #17202a;
  border-radius:999px;background:white;overflow:hidden
}
.chaseMeterFill{height:100%;width:0%;background:#65d66f;transition:.4s}
.catchFlash{
  position:absolute;inset:0;background:rgba(255,226,69,.72);z-index:50;display:grid;place-items:center;
  font-family:Homebody,VAG,sans-serif;font-size:clamp(60px,10vw,150px);text-align:center
}

.vaultScene{
  position:absolute;inset:0;background:linear-gradient(135deg,#152231,#31465d);
  display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:40px
}
.vaultDoor{
  border:8px solid #0b1118;border-radius:34px;background:#6f7b83;position:relative;
  display:grid;place-items:center;box-shadow:inset 0 0 0 12px #8f9ba3
}
.vaultWheel{
  width:190px;height:190px;border:15px solid #26333d;border-radius:50%;position:relative
}
.vaultWheel:before,.vaultWheel:after{
  content:"";position:absolute;left:50%;top:50%;background:#26333d;transform:translate(-50%,-50%)
}
.vaultWheel:before{width:240px;height:18px}.vaultWheel:after{width:18px;height:240px}
.vaultPanel{
  border:6px solid #17202a;border-radius:24px;background:white;padding:22px;display:grid;
  align-content:center;justify-items:center;text-align:center
}
.vaultCode{
  display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0
}
.codeCell{
  width:78px;height:88px;border:5px solid #17202a;border-radius:16px;background:#f7f9fb;
  display:grid;place-items:center;font-size:44px;font-family:VAG,sans-serif
}
.codeCell.active{background:#fff8c9}
.vaultReward{
  position:absolute;inset:0;z-index:60;background:rgba(250,253,255,.97);display:grid;place-items:center;text-align:center
}
.vaultRewardBox{
  border:7px solid #17202a;border-radius:28px;background:white;padding:28px 42px;box-shadow:0 9px 0 #17202a
}
.vaultRewardBox img{width:200px;height:200px;object-fit:contain}
.vaultRewardBox h2{
  font-family:Homebody,VAG,sans-serif;text-transform:uppercase;font-size:clamp(48px,7vw,90px);margin:4px
}
.funConfetti{
  position:absolute;font-size:38px;pointer-events:none;animation:fallConfetti 1.5s ease-in forwards
}
@keyframes fallConfetti{
  from{transform:translateY(-80px) rotate(0);opacity:1}
  to{transform:translateY(580px) rotate(540deg);opacity:0}
}
@media(max-width:850px){
  .bonusGrid{grid-template-columns:1fr}
  .vaultScene{grid-template-columns:1fr;padding:20px}
  .vaultDoor{display:none}
}

</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand">
    <img class="brandAgent" src="agent_girl.png" alt="">
    <div>
      <h1>MS. KAPLE'S KEYBOARD DETECTIVE AGENCY</h1>
      <small>8 CASE FILES • LETTERS + NUMBERS ONLY</small>
    </div>
  </div>
  <nav>
    <button id="homeBtn">🗂️ CASES</button>
    <button id="restartBtn">🔄 RESTART CASE</button>
    <button id="prevBtn">◀ PREV</button>
    <button id="nextBtn">NEXT ▶</button>
  </nav>
</header>

<main>
  <section id="home" class="view active">
    <div class="case-note">🔎 DETECTIVES: CHOOSE A CASE FILE AND USE YOUR KEYBOARD TO SOLVE IT!</div>
    <div id="agencyRankHome" class="rankHome"></div>
    <div id="caseGrid" class="case-grid"></div>
    <div class="bonusHeader">BONUS MISSIONS</div>
    <div class="bonusGrid">
      <button class="bonusCard chaseBonus" id="bonusChase">
        <div class="bonusTitle">MISSION: CATCH THE SUSPECT</div>
        <div class="bonusVisual">
          <img src="agent_boy.png" alt="">
          <div class="chaseArrow">➡</div>
          <img src="agent_girl.png" alt="" style="transform:scaleX(-1)">
        </div>
        <div class="bonusDesc">Press the right letters and numbers to catch the suspect!</div>
      </button>
      <button class="bonusCard vaultBonus" id="bonusVault">
        <div class="bonusTitle">MISSION: CRACK THE VAULT</div>
        <div class="bonusVisual">
          <img src="briefcase.png" alt="">
          <div class="vaultDigits">1 2 3 ?</div>
          <img src="badge_gold.png" alt="">
        </div>
        <div class="bonusDesc">Solve secret keyboard codes to unlock surprise rewards!</div>
      </button>
    </div>

    
  </section>

  <section id="game" class="view">
    <div id="gameWrap">
      <div id="gameTop">
        <div id="gameTitle"></div>
        <div class="badges">
          <div class="badge">⭐ CASE SCORE: <span id="score">0</span></div>
          <div class="badge">🔍 CLUE: <span id="round">1</span>/10</div>
          <div id="rankChip" class="rankChip"></div>
        </div>
      </div>
      <div id="briefing"></div>
      <div id="stage">
        <div id="toast"></div>
      </div>
    </div>
  </section>
</main>
</div>

<script>
const cases = [
  {
    title:"CASE 1: THE MISSING LETTER",
    desc:"Find two letters that disappeared.",
    icon:"🔤", cls:"c1", type:"missingLetter"
  },
  {
    title:"CASE 2: CAPITAL CLUE",
    desc:"Match two uppercase clues to lowercase keys.",
    icon:"🅰️", cls:"c2", type:"capitalMatch"
  },
  {
    title:"CASE 3: FIRST-LETTER FILE",
    desc:"Solve two picture clues in order.",
    icon:"🍎", cls:"c3", type:"firstLetter"
  },
  {
    title:"CASE 4: NUMBER HUNT",
    desc:"Compare three evidence numbers.",
    icon:"🔢", cls:"c4", type:"numberHunt"
  },
  {
    title:"CASE 5: COUNT THE EVIDENCE",
    desc:"Count up to 12 pieces of evidence.",
    icon:"🔎", cls:"c5", type:"countEvidence"
  },
  {
    title:"CASE 6: BEFORE & AFTER",
    desc:"Find two missing numbers in the trail.",
    icon:"🧩", cls:"c6", type:"missingNumber"
  },
  {
    title:"CASE 7: LETTER CODE BREAKER",
    desc:"Crack a four-letter secret code.",
    icon:"🔐", cls:"c7", type:"letterCode"
  },
  {
    title:"CASE 8: NUMBER CODE BREAKER",
    desc:"Crack a five-number secret code.",
    icon:"💻", cls:"c8", type:"numberCode"
  }
];

const caseGrid = document.getElementById("caseGrid");

function autoFit(){
  cancelAnimationFrame(fitRaf);
  fitRaf = requestAnimationFrame(()=>{
    document.body.style.zoom = "1";
    const vw = (window.visualViewport && window.visualViewport.width) || innerWidth || 1366;
    const vh = (window.visualViewport && window.visualViewport.height) || innerHeight || 768;
    const onHome = home.classList.contains("active");
    const designW = 1480;
    const designH = onHome ? 1260 : 900;
    let s = Math.min((vw-14)/designW,(vh-14)/designH,1);
    s = Math.max(.52,Math.min(1,s));
    document.body.style.zoom = s.toFixed(3);
  });
}

function speakText(text){
  if(!('speechSynthesis' in window)){toast('VOICE IS NOT AVAILABLE ON THIS COMPUTER.');return}
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(String(text).replace(/\s+/g,' ').trim());
  u.rate=.82;u.pitch=1.05;u.volume=1;
  const voices=window.speechSynthesis.getVoices();
  const v=voices.find(x=>/en-US/i.test(x.lang))||voices.find(x=>/^en/i.test(x.lang));
  if(v)u.voice=v;
  window.speechSynthesis.speak(u)
}

}
function rankIndexFor(points){
  let idx=0;
  AGENCY_RANKS.forEach((r,i)=>{if(points>=r.min)idx=i});
  return idx
}
function currentRank(){
  const pts=getAgencyPoints();
  return {index:rankIndexFor(pts),points:pts,...AGENCY_RANKS[rankIndexFor(pts)]}
}
function updateRankDisplays(){
  const r=currentRank();
  const homeBox=document.getElementById('agencyRankHome');
  const chip=document.getElementById('rankChip');
  const within=r.next ? r.points-r.min : 1;
  const span=r.next ? r.next-r.min : 1;
  const pct=r.next ? Math.max(0,Math.min(100,(within/span)*100)) : 100;
  const nextText=r.next ? `${r.next-r.points} more clue${r.next-r.points===1?'':'s'} to next badge` : 'TOP AGENCY RANK!';
  if(homeBox){
    homeBox.innerHTML=`
      <img src="${r.img}" alt="">
      <div>
        <div class="rankTitle">${r.title}</div>
        <div class="rankSub">${nextText}</div>
        <div class="rankProgress"><div style="width:${pct}%"></div></div>
      </div>
      <div class="rankPoints">🕵️ ${r.points}<br>AGENCY POINTS</div>`;
  }
  if(chip){
    chip.innerHTML=`<img src="${r.img}" alt=""><span>${r.title}<br>${r.points} PTS</span>`;
  }
}

function listenFor(expected,onWrong){
  clearKeyHandler();
  keyHandler=e=>{
    if(["Shift","Control","Alt","Meta","CapsLock"].includes(e.key))return;
    const val=e.key.length===1?e.key.toUpperCase():e.key;
    if(val===String(expected).toUpperCase()){e.preventDefault();correct()}
    else{
      if(e.key.length===1){e.preventDefault();toast(onWrong||"CHECK THE EVIDENCE AGAIN!")}
    }
  };
  window.addEventListener("keydown",keyHandler)
}
function listenForSequence(expectedList,onWrong){
  clearKeyHandler();
  let idx=0;
  keyHandler=e=>{
    if(["Shift","Control","Alt","Meta","CapsLock"].includes(e.key))return;
    if(e.key.length!==1)return;
    const val=e.key.toUpperCase();
    e.preventDefault();
    if(val===String(expectedList[idx]).toUpperCase()){
      idx++;
      toast(idx>=expectedList.length ? "CLUE COMPLETE! 🔎" : "GOOD! NEXT CLUE.");
      if(idx>=expectedList.length)setTimeout(correct,300);
    }else{
      toast(onWrong||"CHECK THE CLUE ORDER!");
    }
  };
  window.addEventListener("keydown",keyHandler)
}
function listenForNumberString(expected,onWrong){
  clearKeyHandler();
  const target=String(expected);
  let typed="";
  keyHandler=e=>{
    if(!/^[0-9]$/.test(e.key))return;
    e.preventDefault();
    typed += e.key;
    if(!target.startsWith(typed)){
      typed="";
      toast(onWrong||"CHECK THE NUMBER AGAIN!");
      return;
    }
    if(typed===target){
      toast("NUMBER FOUND! 🔎");
      setTimeout(correct,300);
    }else{
      toast("KEEP GOING!");
    }
  };
  window.addEventListener("keydown",keyHandler)
}

function missingLetter(){
  let caseIndex=Math.floor(Math.random()*alphabetEvidenceBank.length);
  if(alphabetEvidenceBank.length>1 && caseIndex===lastAlphabetEvidence){
    caseIndex=(caseIndex+1)%alphabetEvidenceBank.length;
  }
  lastAlphabetEvidence=caseIndex;

  const item=alphabetEvidenceBank[caseIndex];
  const seq=[...item.seq];
  const blanks=[...item.blanks];
  const answers=blanks.map(i=>seq[i]);

  const text='Two letters are missing. Press the missing letters from left to right.';
  setBriefing('🔤',text);
  const p=basePanel();
  p.innerHTML=`<div>
    <div class="smallPrompt">ALPHABET EVIDENCE</div>
    <div class="sequence" style="margin-top:25px">
      ${seq.map((x,i)=>`<div class="seqBox ${blanks.includes(i)?"blank":""}" ${blanks.includes(i)?`data-answer-index="${blanks.indexOf(i)}"`:""}>${blanks.includes(i)?"?":x}</div>`).join("")}
    </div>
    <div class="hint" style="margin-top:25px">Press both missing letters from left to right.</div>
  </div>`;
  addPromptSpeaker(p,`${text} The visible letters are ${seq.map((x,i)=>blanks.includes(i)?'blank':x).join(', ')}.`);

  const answerBoxes=[...p.querySelectorAll('[data-answer-index]')];
  clearKeyHandler();
  let idx=0;
  keyHandler=e=>{
    if(["Shift","Control","Alt","Meta","CapsLock"].includes(e.key))return;
    if(!/^[a-zA-Z]$/.test(e.key))return;
    const val=e.key.toUpperCase();
    e.preventDefault();

    if(val===answers[idx]){
      answerBoxes[idx].textContent=answers[idx];
      answerBoxes[idx].classList.remove('blank');
      answerBoxes[idx].style.background='#dff7df';
      idx++;
      toast(idx>=answers.length ? "ALPHABET CLUE SOLVED! 🔎" : "GOOD! NOW THE NEXT BLANK.");
      if(idx>=answers.length)setTimeout(correct,350);
    }else{
      toast(`LOOK AGAIN — THE NEXT MISSING LETTER IS NOT ${val}.`);
    }
  };
  window.addEventListener("keydown",keyHandler)
}

// CASE 2
function capitalMatch(){
  const pool=Array.from({length:26},(_,i)=>String.fromCharCode(65+i));
  const letters=shuffle(pool).slice(0,2);
  const text=`Match both uppercase clues. Press lowercase ${letters[0].toLowerCase()}, then lowercase ${letters[1].toLowerCase()}. Do not use Shift.`;
  setBriefing('🅰️',text);
  const p=basePanel();
  p.innerHTML=`<div>
    <div class="smallPrompt">UPPERCASE EVIDENCE</div>
    <div class="sequence" style="margin-top:16px">
      <div class="seqBox">${letters[0]}</div>
      <div class="seqBox">${letters[1]}</div>
    </div>
    <div class="smallPrompt" style="margin-top:18px">YOUR LOWERCASE MATCHES</div>
    <div class="sequence" style="margin-top:10px">
      <div class="seqBox blank answerFill">?</div>
      <div class="seqBox blank answerFill">?</div>
    </div>
    <div class="hint" style="margin-top:15px">Press each letter key by itself — no Shift.</div>
  </div>`;
  addPromptSpeaker(p,text);

  const boxes=[...p.querySelectorAll('.answerFill')];
  clearKeyHandler();
  let idx=0;
  keyHandler=e=>{
    if(["Control","Alt","Meta","CapsLock"].includes(e.key))return;
    if(e.key==="Shift")return;
    if(!/^[a-zA-Z]$/.test(e.key))return;
    e.preventDefault();

    if(e.key!==e.key.toLowerCase()){
      toast("LOWERCASE ONLY — DO NOT HOLD SHIFT.");
      return;
    }

    if(e.key===letters[idx].toLowerCase()){
      boxes[idx].textContent=e.key;
      boxes[idx].classList.remove('blank');
      boxes[idx].style.background='#dff7df';
      idx++;
      toast(idx>=letters.length ? "LOWERCASE MATCHES SOLVED! 🔎" : "GOOD! MATCH THE NEXT LETTER.");
      if(idx>=letters.length)setTimeout(correct,350);
    }else{
      toast("CHECK THE UPPERCASE LETTER ABOVE.");
    }
  };
  window.addEventListener("keydown",keyHandler)
}

// CASE 6
function missingNumber(){
  const start=Math.floor(Math.random()*13);
  const seq=[start,start+1,start+2,start+3,start+4,start+5,start+6];
  const blanks=shuffle([1,2,3,4,5]).slice(0,2).sort((a,b)=>a-b);
  const answers=blanks.map(i=>String(seq[i]));
  const text='Two numbers are missing. Type the missing numbers from left to right.';
  setBriefing('🧩',text);
  const p=basePanel();
  p.innerHTML=`<div>
    <div class="smallPrompt">NUMBER TRAIL</div>
    <div class="sequence" style="margin-top:25px">
      ${seq.map((x,i)=>`<div class="seqBox ${blanks.includes(i)?"blank":""}" ${blanks.includes(i)?`data-number-answer="${blanks.indexOf(i)}"`:""}>${blanks.includes(i)?"?":x}</div>`).join("")}
    </div>
    <div class="hint" style="margin-top:20px">Some missing numbers may have two digits.</div>
  </div>`;
  addPromptSpeaker(p,text);

  const boxes=[...p.querySelectorAll('[data-number-answer]')];
  clearKeyHandler();
  let answerIndex=0, typed="";
  keyHandler=e=>{
    if(!/^[0-9]$/.test(e.key))return;
    e.preventDefault();
    const target=answers[answerIndex];
    typed += e.key;

    // Show partial two-digit input as they type.
    boxes[answerIndex].textContent=typed;
    boxes[answerIndex].style.background='#fff8c9';

    if(!target.startsWith(typed)){
      typed="";
      boxes[answerIndex].textContent='?';
      boxes[answerIndex].style.background='';
      toast("CHECK THE NUMBER TRAIL!");
      return;
    }
    if(typed===target){
      boxes[answerIndex].textContent=target;
      boxes[answerIndex].classList.remove('blank');
      boxes[answerIndex].style.background='#dff7df';
      answerIndex++;
      typed="";
      if(answerIndex>=answers.length){
        toast("NUMBER TRAIL SOLVED!");
        setTimeout(correct,350);
      }else{
        toast("GOOD! FIND THE NEXT NUMBER.");
      }
    }
  };
  window.addEventListener("keydown",keyHandler)
}

function letterCode(){
  const code=Array.from({length:4},()=>letter());
  let idx=0;
  setBriefing('🔐','Crack the four-letter code. Press the letters in order.');
  const p=basePanel();
  function paint(){
    p.innerHTML=`<div>
      <div class="smallPrompt">SECRET LETTER CODE</div>
      <div class="sequence" style="margin-top:16px">
        ${code.map((x,i)=>`<div class="seqBox" style="${i===idx?"background:#fff8c9":""}">${x}</div>`).join("")}
      </div>
      <div class="smallPrompt" style="margin-top:18px">YOUR CODE</div>
      <div class="sequence" style="margin-top:10px">
        ${code.map((x,i)=>`<div class="seqBox ${i>=idx?"blank":""}">${i<idx?x:"?"}</div>`).join("")}
      </div>
      <div class="hint" style="margin-top:18px">Press the letters from left to right.</div>
    </div>`
  }
  paint();
  addPromptSpeaker(p,'Press all four secret letters in order from left to right.');
  clearKeyHandler();
  keyHandler=e=>{
    if(e.key.length!==1)return;
    const v=e.key.toUpperCase();
    e.preventDefault();
    if(v===code[idx]){
      idx++;
      toast(idx>=code.length?"CODE COMPLETE!":"GOOD CLUE!");
      paint();
      if(idx>=code.length){setTimeout(()=>showCodeReward(correct),350)}
    }else toast("THAT LETTER DOESN'T MATCH!")
  };
  window.addEventListener("keydown",keyHandler)
}
